name: Docker publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: fchaussin/signature-remove-bg

jobs:
  build-standard-arm64:
    name: Build standard (arm64)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest (arm64, standard)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=standard-arm64
          cache-to: type=gha,mode=max,scope=standard-arm64

  build-hardened-amd64:
    name: Build hardened/DHI (amd64)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hardened (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest (amd64, hardened)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.hardened
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=hardened-amd64
          cache-to: type=gha,mode=max,scope=hardened-amd64

  publish:
    name: Assemble manifests
    runs-on: ubuntu-latest
    needs: [build-standard-arm64, build-hardened-amd64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="$(echo "$VERSION" | awk -F. '{print $1"."$2}')"
          MAJOR="$(echo "$VERSION" | awk -F. '{print $1}')"
          {
            echo "value=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest (standard arm64 + hardened amd64)
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }} \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major_minor }} \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}@${{ needs.build-standard-arm64.outputs.digest }} \
            ${{ env.IMAGE_NAME }}@${{ needs.build-hardened-amd64.outputs.digest }}

      - name: Create hardened-only tags (amd64 DHI)
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}-hardened \
            -t ${{ env.IMAGE_NAME }}:hardened \
            ${{ env.IMAGE_NAME }}@${{ needs.build-hardened-amd64.outputs.digest }}

      - name: Inspect produced tags
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}-hardened
